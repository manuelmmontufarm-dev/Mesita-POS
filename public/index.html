<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#009DFF" />
<title>Mesita POS — Consola de caja</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/pos-v2/pos.css?v=202607061731" />
</head>
<!--
  This IS the Mesita POS v2 app entry point (served directly at "/"), so opening
  the dashboard no longer shows a "Redirigiendo a Mesita POS v2…" hop.
  It mirrors pos-v2.html — keep the two in sync (same scripts / same app).
-->
<body>
<div id="root">
  <!-- Static boot shell: first paint happens straight from HTML, before any
       JS. React replaces it on mount with the identical AuthGate loader. -->
  <div class="pos-boot" aria-live="polite">
    <img class="pos-boot-logo" src="/logo.svg" alt="" width="64" height="64" />
    <div class="pos-boot-name">Mesita POS<small>Consola de caja</small></div>
    <div class="pos-boot-bar" role="progressbar" aria-label="Cargando Mesita POS"></div>
    <div class="pos-boot-msg">Preparando la caja…</div>
  </div>
</div>

<!-- Precompiled (npm run build:pos-v2) — no Babel in the browser. `defer`
     keeps parsing/painting unblocked and preserves execution order. -->
<script defer src="/pos-v2/vendor/react.production.min.js?v=202607061731"></script>
<script defer src="/pos-v2/vendor/react-dom.production.min.js?v=202607061731"></script>
<script defer src="/pos-v2/dist/data.js?v=202607061731"></script>
<script defer src="/pos-v2/dist/store-api.js?v=202607061731"></script>
<script defer src="/pos-v2/dist/ui.js?v=202607061731"></script>
<script defer src="/pos-v2/dist/floor.js?v=202607061731"></script>
<script defer src="/pos-v2/dist/cobro.js?v=202607061731"></script>
<script defer src="/pos-v2/dist/order.js?v=202607061731"></script>
<script defer src="/pos-v2/dist/history.js?v=202607061731"></script>
<script defer src="/pos-v2/dist/app.js?v=202607061731"></script>
<script defer src="/pos-v2/dist/auth-gate.js?v=202607061731"></script>
<script defer src="/pos-v2/dist/boot.js?v=202607061731"></script>
</body>
</html>
