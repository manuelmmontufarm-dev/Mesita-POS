<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contífico Lab · POS de mesero</title>
  <style>
    :root {
      --bg: #0e0d0c; --panel: #171514; --line: rgba(255,255,255,.09);
      --ink: #f2efe9; --mut: rgba(242,239,233,.55);
      --green: #2fb37e; --green-dark: #1f9b6a; --amber: #f2a93b; --red: #ff5a4f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
      background: var(--bg); color: var(--ink); min-height: 100vh;
      display: flex; flex-direction: column; user-select: none;
    }
    header {
      display: flex; align-items: center; gap: 12px; padding: 12px 18px;
      border-bottom: 1px solid var(--line); background: var(--panel);
    }
    header h1 { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
    header .sub { font-size: 11.5px; color: var(--mut); }
    header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px rgba(47,179,126,.7); margin-left: auto; }
    header .dot.off { background: var(--red); box-shadow: none; }

    .wrap { display: grid; grid-template-columns: 300px 1fr 340px; gap: 14px; padding: 14px; flex: 1; min-height: 0; }
    @media (max-width: 980px) { .wrap { grid-template-columns: 1fr; } }
    .col { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; overflow-y: auto; }
    .col h2 { font-size: 11px; font-weight: 800; letter-spacing: .12em; color: var(--mut); margin-bottom: 12px; text-transform: uppercase; }

    /* mesas */
    .mesas { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .mesa {
      border: 1px solid var(--line); border-radius: 13px; background: #1d1b19;
      color: var(--ink); font: inherit; padding: 14px 10px; cursor: pointer;
      display: flex; flex-direction: column; gap: 3px; align-items: flex-start;
      transition: transform .06s ease, border-color .12s, background .12s;
    }
    .mesa:active { transform: scale(.955); }
    .mesa .nm { font-size: 14px; font-weight: 700; }
    .mesa .st { font-size: 11px; color: var(--mut); }
    .mesa.abierta { border-color: rgba(242,169,59,.5); background: rgba(242,169,59,.08); }
    .mesa.abierta .st { color: var(--amber); font-weight: 700; }
    .mesa.sel { border-color: var(--green); box-shadow: 0 0 0 1px var(--green), 0 0 18px -6px rgba(47,179,126,.5); }

    /* productos */
    .prods { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 9px; }
    .prod {
      border: 1px solid var(--line); border-radius: 13px; background: #1d1b19; color: var(--ink);
      font: inherit; padding: 15px 12px; cursor: pointer; text-align: left;
      transition: transform .06s ease, background .12s;
    }
    .prod:active { transform: scale(.94); background: rgba(47,179,126,.14); }
    .prod .nm { font-size: 13.5px; font-weight: 700; display: block; }
    .prod .pr { font-size: 12px; color: var(--mut); font-variant-numeric: tabular-nums; }
    .prod:disabled { opacity: .35; pointer-events: none; }
    .hint { font-size: 12px; color: var(--mut); padding: 8px 2px; }

    /* cuenta */
    .cta-row { display: flex; gap: 9px; margin-bottom: 12px; }
    .btn {
      flex: 1; border: none; border-radius: 13px; font: inherit; font-weight: 800;
      padding: 15px 10px; cursor: pointer; font-size: 14px;
      transition: transform .06s ease, filter .12s;
    }
    .btn:active { transform: scale(.955); }
    .btn:disabled { opacity: .35; pointer-events: none; }
    .btn.pre { background: var(--amber); color: #33230a; }
    .btn.fac { background: var(--green); color: #06251a; }
    .btn.anu { background: transparent; color: var(--red); border: 1px solid rgba(255,90,79,.4); flex: 0 0 auto; padding: 15px 14px; }
    .lineas { display: flex; flex-direction: column; gap: 6px; }
    .linea {
      display: grid; grid-template-columns: 30px 1fr auto 26px; gap: 8px; align-items: center;
      padding: 8px 10px; border-radius: 10px; background: #1d1b19; font-size: 13px;
    }
    .linea .q { color: var(--mut); font-variant-numeric: tabular-nums; }
    .linea .p { font-variant-numeric: tabular-nums; }
    .linea .x { border: none; background: none; color: var(--mut); cursor: pointer; font-size: 15px; border-radius: 7px; }
    .linea .x:hover { color: var(--red); }
    .tot { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 10px; font-size: 12.5px; color: var(--mut); display: flex; flex-direction: column; gap: 4px; }
    .tot .grand { font-size: 19px; font-weight: 800; color: var(--ink); display: flex; justify-content: space-between; }
    .tot div { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }

    .toast {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: #23211f; border: 1px solid var(--line); color: var(--ink);
      border-radius: 999px; padding: 10px 20px; font-size: 13px; font-weight: 600;
      transition: transform .25s cubic-bezier(.22,1,.36,1); pointer-events: none; z-index: 10;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <header>
    <h1>🍽 Contífico Lab — POS de mesero</h1>
    <span class="sub">escribe al MySQL local `pos_contifico` · Mesita solo se entera vía Bridge</span>
    <span class="dot off" id="conn"></span>
  </header>

  <div class="wrap">
    <section class="col">
      <h2>Mesas</h2>
      <div class="mesas" id="mesas"></div>
    </section>

    <section class="col">
      <h2>Platos — toca para agregar</h2>
      <div class="hint" id="prodHint">Elige una mesa y confirma la pre-cuenta para empezar.</div>
      <div class="prods" id="prods"></div>
    </section>

    <section class="col">
      <h2>Cuenta · <span id="mesaSel">—</span></h2>
      <div class="cta-row">
        <button class="btn pre" id="btnPre">Pre-Cuenta</button>
        <button class="btn fac" id="btnFac">FACTURAR</button>
        <button class="btn anu" id="btnAnu">Anular</button>
      </div>
      <div class="lineas" id="lineas"></div>
      <div class="tot" id="tot"></div>
    </section>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const MESAS = ["Mesa 1","Mesa 2","Mesa 3","Mesa 4","Mesa 5","Mesa 6","Mesa 7","Mesa 8"];
    const PRODUCTOS = [
      ["Ceviche de camarón", 9.50], ["Seco de pollo", 8.50], ["Encebollado", 6.00],
      ["Pizza margarita", 12.90], ["Lomo saltado", 11.50], ["Cazuela de mariscos", 13.00],
      ["Jugo de maracuyá", 2.75], ["Limonada", 2.25], ["Cola", 1.80],
      ["Café pasado", 1.50], ["Tres leches", 4.50], ["Helado de paila", 3.75],
    ];
    const $ = (id) => document.getElementById(id);
    let sel = null;          // mesa seleccionada
    let estado = { mesas: [] };

    const money = (n) => "$" + n.toFixed(2);
    const abierta = (m) => estado.mesas.find((x) => x.mesa === m) || null;

    function toast(txt) {
      const t = $("toast");
      t.textContent = txt;
      t.classList.add("show");
      clearTimeout(t._h);
      t._h = setTimeout(() => t.classList.remove("show"), 1600);
    }

    async function api(path, body) {
      const res = await fetch("/lab" + path, {
        method: body ? "POST" : "GET",
        headers: body ? { "Content-Type": "application/json" } : {},
        body: body ? JSON.stringify(body) : undefined,
      });
      const j = await res.json().catch(() => ({}));
      if (!res.ok || j.ok === false) throw new Error(j.error || res.statusText);
      return j;
    }

    function pintar() {
      // mesas
      $("mesas").innerHTML = MESAS.map((m) => {
        const a = abierta(m);
        return `<button class="mesa ${a ? "abierta" : ""} ${sel === m ? "sel" : ""}" data-m="${m}">
          <span class="nm">${m}</span>
          <span class="st">${a ? `${a.secuencia} · ${money(a.total)}` : "Libre"}</span>
        </button>`;
      }).join("");
      document.querySelectorAll(".mesa").forEach((b) =>
        b.addEventListener("click", () => { sel = b.dataset.m; pintar(); }));

      // productos
      const a = sel ? abierta(sel) : null;
      $("prodHint").style.display = a ? "none" : "block";
      $("prods").innerHTML = PRODUCTOS.map(([n, p], i) =>
        `<button class="prod" data-i="${i}" ${a ? "" : "disabled"}>
          <span class="nm">${n}</span><span class="pr">${money(p)}</span>
        </button>`).join("");
      document.querySelectorAll(".prod").forEach((b) =>
        b.addEventListener("click", () => agregar(Number(b.dataset.i))));

      // cuenta
      $("mesaSel").textContent = sel || "—";
      $("btnPre").disabled = !sel || !!a;
      $("btnFac").disabled = !a || !a.items.length;
      $("btnAnu").disabled = !a;
      $("lineas").innerHTML = (a?.items || []).map((i) =>
        `<div class="linea">
          <span class="q">${i.cantidad}×</span><span>${i.nombre}</span>
          <span class="p">${money(i.precio * i.cantidad)}</span>
          <button class="x" data-l="${i.lineaId}" title="Quitar">✕</button>
        </div>`).join("");
      document.querySelectorAll(".linea .x").forEach((b) =>
        b.addEventListener("click", () => quitar(Number(b.dataset.l))));
      $("tot").innerHTML = a ? `
        <div><span>Subtotal</span><span>${money(a.subtotal)}</span></div>
        <div><span>IVA 15%</span><span>${money(a.iva)}</span></div>
        <div><span>Servicio 10%</span><span>${money(a.servicio)}</span></div>
        <div class="grand"><span>Total</span><span>${money(a.total)}</span></div>` : "";
    }

    async function refrescar() {
      try {
        estado = await api("/state");
        $("conn").classList.remove("off");
      } catch { $("conn").classList.add("off"); }
      pintar();
    }

    // acciones — optimistas: disparan y refrescan; el POS real también es local e inmediato
    async function agregar(i) {
      if (!sel) return;
      const [nombre, precio] = PRODUCTOS[i];
      try { await api("/agregar", { mesa: sel, nombre, precio, cantidad: 1 }); await refrescar(); }
      catch (e) { toast("✖ " + e.message); }
    }
    async function quitar(lineaId) {
      try { await api("/quitar", { mesa: sel, lineaId }); await refrescar(); }
      catch (e) { toast("✖ " + e.message); }
    }
    $("btnPre").addEventListener("click", async () => {
      try { const r = await api("/precuenta", { mesa: sel }); toast(`🧾 Pre-cuenta ${r.secuencia} abierta — ya la ve el Bridge`); await refrescar(); }
      catch (e) { toast("✖ " + e.message); }
    });
    $("btnFac").addEventListener("click", async () => {
      try { const r = await api("/facturar", { mesa: sel, formaPago: "TC" }); toast(`✅ Facturado ${r.documento} · ${money(r.total)} — P→C, sale del Bridge`); await refrescar(); }
      catch (e) { toast("✖ " + e.message); }
    });
    $("btnAnu").addEventListener("click", async () => {
      try { await api("/anular", { mesa: sel }); toast("Anulada (estado A)"); await refrescar(); }
      catch (e) { toast("✖ " + e.message); }
    });

    refrescar();
    setInterval(refrescar, 2500);
  </script>
</body>
</html>
