<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Contífico Lab · POS de mesero</title>
<link rel="icon" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<!-- MISMO sistema de diseño del POS (paleta Contífico/Siigo) -->
<link rel="stylesheet" href="/pos-v2/pos.css" />
<style>
  /* Único CSS propio del lab: la rejilla de 3 columnas. Todo lo demás
     (botones, tarjetas, cuenta, toasts) son clases del POS. */
  .lab { display: grid; grid-template-columns: 300px 1fr 360px; gap: 0; height: calc(100vh - 63px); }
  @media (max-width: 1100px) { .lab { grid-template-columns: 1fr; height: auto; } }
  .lab-col { padding: 20px; overflow-y: auto; }
  .lab-col + .lab-col { border-left: 1px solid var(--line); }
  .lab-col.bill-col { padding: 0; background: var(--surface); }
  .lab .tables { grid-template-columns: 1fr; gap: 10px; }
  .lab .tcard { min-height: 0; padding: 13px 15px; gap: 3px; }
  .lab .tcard .tn { font-weight: 750; font-size: .98rem; }
  .lab .tcard .ts { font-size: .78rem; color: var(--ink-mut); }
  .lab .tcard.abierta { border-color: var(--warn); background: var(--warn-soft); }
  .lab .tcard.abierta .ts { color: #B97A14; font-weight: 700; }
  .lab .tcard.sel { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand), var(--sh-md); }
  .lab .prods { grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); }
  .lab .pcard { min-height: 0; padding: 13px 14px; gap: 3px; }
  .lab .pcard:disabled { opacity: .45; pointer-events: none; }
  .lab .acts { display: flex; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .hint { color: var(--ink-mut); font-size: .88rem; padding: 10px 2px 16px; }
  [hidden] { display: none !important; }   /* .pill-doc trae display:inline-block */
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 9h18M8 4V2.5M16 4V2.5"/>
      </svg>
    </span>
    <span class="brand-name">Contífico Lab<small>POS de mesero · laboratorio</small></span>
  </div>
  <span class="spacer" style="flex:1"></span>
  <span class="api-pill" id="conn">Conectando…</span>
</header>

<div class="lab">
  <!-- Mesas -->
  <section class="lab-col">
    <div class="zone-h"><span class="nm">Mesas</span><span class="ct" id="ctAbiertas">0</span><span class="ln"></span></div>
    <div class="tables" id="mesas"></div>
  </section>

  <!-- Platos -->
  <section class="lab-col">
    <div class="zone-h"><span class="nm">Platos</span><span class="ln"></span></div>
    <div class="hint" id="prodHint">Elige una mesa y confirma la pre-cuenta para empezar.</div>
    <div class="prods" id="prods"></div>
  </section>

  <!-- Cuenta -->
  <section class="lab-col bill-col">
    <div class="bill">
      <div class="bill-head">
        <div class="bt">Pre-cuenta <span class="pill-doc PRE" id="secuencia" hidden></span></div>
        <div class="bsub" id="mesaSel">Ninguna mesa seleccionada</div>
      </div>
      <div class="acts">
        <button class="btn btn-primary btn-sm" id="btnPre">Pre-Cuenta</button>
        <button class="btn btn-ok btn-sm" id="btnFac" style="flex:1">FACTURAR</button>
        <button class="btn btn-danger-soft btn-sm" id="btnAnu">Anular</button>
      </div>
      <div class="bill-items" id="lineas"></div>
      <div class="totals" id="tot"></div>
    </div>
  </section>
</div>

<div class="toasts" id="toasts"></div>

<script>
const MESAS = ["Mesa 1","Mesa 2","Mesa 3","Mesa 4","Mesa 5","Mesa 6","Mesa 7","Mesa 8"];
const PRODUCTOS = [
  ["🐟","Ceviche de camarón",9.50], ["🍗","Seco de pollo",8.50], ["🍲","Encebollado",6.00],
  ["🍕","Pizza margarita",12.90], ["🥩","Lomo saltado",11.50], ["🦐","Cazuela de mariscos",13.00],
  ["🧃","Jugo de maracuyá",2.75], ["🍋","Limonada",2.25], ["🥤","Cola",1.80],
  ["☕","Café pasado",1.50], ["🍰","Tres leches",4.50], ["🍨","Helado de paila",3.75],
];
const $ = (id) => document.getElementById(id);
let sel = null, estado = { mesas: [] };

const money = (n) => "$" + n.toFixed(2);
const abierta = (m) => estado.mesas.find((x) => x.mesa === m) || null;

function toast(msg, kind = "ok", emoji = "✓") {
  const t = document.createElement("div");
  t.className = "toast " + kind;
  t.innerHTML = `<span class="te">${emoji}</span><span>${msg}</span>`;
  $("toasts").appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

async function api(path, body) {
  const res = await fetch("/lab" + path, {
    method: body ? "POST" : "GET",
    headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const j = await res.json().catch(() => ({}));
  if (!res.ok || j.ok === false) throw new Error(j.error || res.statusText);
  return j;
}

function pintar() {
  const a = sel ? abierta(sel) : null;
  $("ctAbiertas").textContent = `${estado.mesas.length} abierta${estado.mesas.length === 1 ? "" : "s"}`;

  $("mesas").innerHTML = MESAS.map((m) => {
    const o = abierta(m);
    return `<button class="tcard ${o ? "abierta" : ""} ${sel === m ? "sel" : ""}" data-m="${m}">
      <span class="tn">${m}</span>
      <span class="ts">${o ? `${o.secuencia} · ${money(o.total)}` : "Libre"}</span>
    </button>`;
  }).join("");
  document.querySelectorAll(".tcard").forEach((b) =>
    b.addEventListener("click", () => { sel = b.dataset.m; pintar(); }));

  $("prodHint").style.display = a ? "none" : "block";
  $("prods").innerHTML = PRODUCTOS.map(([ic, n, p], i) =>
    `<button class="pcard" data-i="${i}" ${a ? "" : "disabled"}>
      <span class="pi">${ic}</span><span class="pn">${n}</span><span class="pp tnum">${money(p)}</span>
    </button>`).join("");
  document.querySelectorAll(".pcard").forEach((b) =>
    b.addEventListener("click", () => agregar(Number(b.dataset.i))));

  $("mesaSel").textContent = sel ? (a ? `${sel} · cuenta abierta` : `${sel} · sin pre-cuenta`) : "Ninguna mesa seleccionada";
  const secu = $("secuencia");
  secu.hidden = !a; if (a) secu.textContent = a.secuencia;
  $("btnPre").disabled = !sel || !!a;
  $("btnFac").disabled = !a || !a.items.length;
  $("btnAnu").disabled = !a;

  $("lineas").innerHTML = a && a.items.length
    ? a.items.map((i) => `<div class="li">
        <span class="lpi">${(PRODUCTOS.find((p) => p[1] === i.nombre) || ["🍽"])[0]}</span>
        <span class="lmain"><span class="lnm">${i.nombre}</span>
          <span class="qty"><span class="qv">${i.cantidad}</span><span class="qx">× ${money(i.precio)}</span></span></span>
        <span class="lright"><span class="lp tnum">${money(i.precio * i.cantidad)}</span>
          <button class="ldel" data-l="${i.lineaId}" title="Quitar">✕</button></span>
      </div>`).join("")
    : `<div class="bill-empty"><span class="be">🧾</span><span class="bh">${a ? "Sin platos todavía" : "Sin pre-cuenta"}</span>
       <span>${a ? "Toca un plato para agregarlo." : "Selecciona una mesa y abre la pre-cuenta."}</span></div>`;
  document.querySelectorAll(".ldel").forEach((b) =>
    b.addEventListener("click", () => quitar(Number(b.dataset.l))));

  $("tot").innerHTML = a ? `
    <div class="tr"><span>Subtotal</span><span class="tnum">${money(a.subtotal)}</span></div>
    <div class="tr"><span>IVA 15%</span><span class="tnum">${money(a.iva)}</span></div>
    <div class="tr"><span>Servicio 10%</span><span class="tnum">${money(a.servicio)}</span></div>
    <div class="tr grand"><span>Total</span><span class="tnum">${money(a.total)}</span></div>` : "";
}

async function refrescar() {
  try {
    estado = await api("/state");
    $("conn").textContent = "MySQL pos_contifico · en línea";
    $("conn").style.color = "";
  } catch {
    $("conn").textContent = "Sin conexión al MySQL";
    $("conn").style.color = "var(--bad)";
  }
  pintar();
}

async function agregar(i) {
  if (!sel) return;
  const [, nombre, precio] = PRODUCTOS[i];
  try { await api("/agregar", { mesa: sel, nombre, precio, cantidad: 1 }); await refrescar(); }
  catch (e) { toast(e.message, "bad", "✕"); }
}
async function quitar(lineaId) {
  try { await api("/quitar", { mesa: sel, lineaId }); await refrescar(); }
  catch (e) { toast(e.message, "bad", "✕"); }
}
$("btnPre").addEventListener("click", async () => {
  try { const r = await api("/precuenta", { mesa: sel }); toast(`Pre-cuenta ${r.secuencia} abierta — ya la ve el Bridge`, "mqr", "🧾"); await refrescar(); }
  catch (e) { toast(e.message, "bad", "✕"); }
});
$("btnFac").addEventListener("click", async () => {
  try { const r = await api("/facturar", { mesa: sel, formaPago: "TC" }); toast(`Facturado ${r.documento} · ${money(r.total)} — P→C, sale del Bridge`, "ok", "✓"); await refrescar(); }
  catch (e) { toast(e.message, "bad", "✕"); }
});
$("btnAnu").addEventListener("click", async () => {
  try { await api("/anular", { mesa: sel }); toast("Pre-cuenta anulada (estado A)", "bad", "⊘"); await refrescar(); }
  catch (e) { toast(e.message, "bad", "✕"); }
});

refrescar();
setInterval(refrescar, 2500);
</script>
</body>
</html>
