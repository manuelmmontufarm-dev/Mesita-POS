# Contífico POS Lab — app de escritorio (solo pruebas locales, no se deploya).
appId: com.mesitaqr.contifico-pos-lab
productName: Contifico POS Lab
directories:
  output: dist-desktop
# Sin asar: el server Express (express.static, prisma, mysql2) corre igual que
# en Node normal, sin sorpresas de rutas dentro del archivo asar.
asar: false
files:
  - "desktop/**/*"
  - "src/**/*"
  - "public/**/*"
  - "package.json"
  - "node_modules/**/*"
  # los globs ignoran dot-folders: el cliente generado de Prisma vive en .prisma
  - "node_modules/.prisma/**/*"
  - "!node_modules/electron/**"
  - "!node_modules/electron-builder/**"
  - "!node_modules/.cache/**"
mac:
  target:
    - target: dir
      arch: [arm64]
  icon: desktop/icon.png   # logo del POS (plato + cubiertos, azul Contífico) a 1024px
  category: public.app-category.business
