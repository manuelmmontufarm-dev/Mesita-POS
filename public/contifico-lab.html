<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Contífico Lab · POS de mesero</title>
<link rel="icon" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<!-- MISMO sistema de diseño del POS (paleta Contífico/Siigo) -->
<link rel="stylesheet" href="/pos-v2/pos.css" />
<style>
  /* Único CSS propio del lab: la rejilla de 3 columnas + panel Bridge. Todo lo
     demás (botones, tarjetas, cuenta, toasts) son clases del POS. */
  .lab { display: grid; grid-template-columns: 300px 1fr 360px; gap: 0; height: calc(100vh - 63px); }
  @media (max-width: 1100px) { .lab { grid-template-columns: 1fr; height: auto; } }
  .lab-col { padding: 20px; overflow-y: auto; }
  .lab-col + .lab-col { border-left: 1px solid var(--line); }
  .lab-col.bill-col { padding: 0; background: var(--surface); }
  .lab .tables { grid-template-columns: 1fr; gap: 10px; }
  .lab .tcard { min-height: 0; padding: 13px 15px; gap: 3px; }
  .lab .tcard .tn { font-weight: 750; font-size: .98rem; }
  .lab .tcard .ts { font-size: .78rem; color: var(--ink-mut); }
  .lab .tcard.abierta { border-color: var(--warn); background: var(--warn-soft); }
  .lab .tcard.abierta .ts { color: #B97A14; font-weight: 700; }
  .lab .tcard.sel { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand), var(--sh-md); }
  .lab .prods { grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); }
  .lab .pcard { min-height: 0; padding: 13px 14px; gap: 3px; }
  .lab .pcard:disabled { opacity: .45; pointer-events: none; }
  .lab .pcard:active { transform: scale(.96); transition: transform .04s; }
  .lab .acts { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .lab .acts #btnSave { flex: 1 1 150px; }
  .hint { color: var(--ink-mut); font-size: .88rem; padding: 10px 2px 16px; }
  [hidden] { display: none !important; }   /* .pill-doc trae display:inline-block */

  /* línea pendiente de confirmar por el servidor (optimista) */
  .li.pend { opacity: .55; }
  .li.pend .lp::after { content: " ⏳"; font-size: .7em; }

  /* ── panel Verificar Bridge ── */
  .scrim2 { position: fixed; inset: 0; background: rgba(34,43,69,.4); backdrop-filter: blur(3px); z-index: 90; display: grid; place-items: center; }
  .bpanel { width: min(560px, 92vw); max-height: 86vh; overflow-y: auto; background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--sh-lg); padding: 22px 24px; }
  .bpanel h2 { font-size: 1.15rem; font-weight: 800; letter-spacing: -.02em; display: flex; align-items: center; gap: 9px; }
  .bpanel .sub2 { font-size: .84rem; color: var(--ink-mut); margin: 4px 0 16px; }
  .bcheck { display: flex; align-items: flex-start; gap: 11px; border: 1px solid var(--line); border-radius: var(--r-md); padding: 11px 13px; margin-bottom: 8px; transition: all .3s var(--ease); }
  .bcheck.ok { border-color: rgba(97,155,46,.45); background: var(--ok-soft); }
  .bcheck.bad { border-color: rgba(212,33,67,.4); background: var(--bad-soft); }
  .bcheck .bi { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: .78rem; font-weight: 800; flex: 0 0 auto; background: var(--muted-surf); color: var(--ink-mut); }
  .bcheck.ok .bi { background: var(--ok); color: #fff; }
  .bcheck.bad .bi { background: var(--bad); color: #fff; }
  .bcheck b { font-size: .9rem; display: block; }
  .bcheck small { font-size: .78rem; color: var(--ink-mut); }
  .bconn { margin-top: 14px; border-top: 1px dashed var(--line); padding-top: 12px; font-size: .82rem; }
  .bconn .row2 { display: flex; justify-content: space-between; padding: 3px 0; }
  .bconn .row2 code { background: var(--muted-surf); border-radius: 6px; padding: 1px 8px; font-size: .8rem; }
  .bdownload { display: flex; margin-top: 12px; text-decoration: none; justify-content: center; }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 9h18M8 4V2.5M16 4V2.5"/>
      </svg>
    </span>
    <span class="brand-name">Contífico Lab<small>POS de mesero · laboratorio</small></span>
  </div>
  <span class="spacer" style="flex:1"></span>
  <button class="btn btn-outline btn-sm" id="btnBridge">🔌 Verificar Bridge</button>
  <span class="api-pill" id="conn">Conectando…</span>
</header>

<div class="lab">
  <!-- Mesas -->
  <section class="lab-col">
    <div class="zone-h"><span class="nm">Mesas</span><span class="ct" id="ctAbiertas">0</span><span class="ln"></span></div>
    <div class="tables" id="mesas"></div>
  </section>

  <!-- Platos -->
  <section class="lab-col">
    <div class="zone-h"><span class="nm">Platos</span><span class="ln"></span></div>
    <div class="hint" id="prodHint">Elige una mesa y confirma la pre-cuenta para empezar.</div>
    <div class="prods" id="prods"></div>
  </section>

  <!-- Cuenta -->
  <section class="lab-col bill-col">
    <div class="bill">
      <div class="bill-head">
        <div class="bt">Pre-cuenta <span class="pill-doc PRE" id="secuencia" hidden></span></div>
        <div class="bsub" id="mesaSel">Ninguna mesa seleccionada</div>
      </div>
      <div class="acts">
        <button class="btn btn-primary btn-sm" id="btnPre">Pre-Cuenta</button>
        <button class="btn btn-primary btn-sm" id="btnSave">Guardar cambios</button>
        <button class="btn btn-ok btn-sm" id="btnFac" style="flex:1">FACTURAR</button>
        <button class="btn btn-danger-soft btn-sm" id="btnAnu">Anular</button>
      </div>
      <div class="bill-items" id="lineas"></div>
      <div class="totals" id="tot"></div>
    </div>
  </section>
</div>

<div class="toasts" id="toasts"></div>
<div class="scrim2" id="bridgeScrim" hidden></div>

<script>
const MESAS = ["Mesa 1","Mesa 2","Mesa 3","Mesa 4","Mesa 5","Mesa 6","Mesa 7","Mesa 8"];
const PRODUCTOS = [
  ["🐟","Ceviche de camarón",9.50], ["🍗","Seco de pollo",8.50], ["🍲","Encebollado",6.00],
  ["🍕","Pizza margarita",12.90], ["🥩","Lomo saltado",11.50], ["🦐","Cazuela de mariscos",13.00],
  ["🧃","Jugo de maracuyá",2.75], ["🍋","Limonada",2.25], ["🥤","Cola",1.80],
  ["☕","Café pasado",1.50], ["🍰","Tres leches",4.50], ["🍨","Helado de paila",3.75],
];
const $ = (id) => document.getElementById(id);
let sel = null, estado = { mesas: [] };
let inflight = 0;          // ops optimistas sin confirmar → el poll no pisa la UI
let tmpId = -1;            // ids locales para líneas aún no confirmadas
const dirtyMesas = new Set(); // borradores: Contífico aún no los guardó en MySQL
let savingMesa = null;

const money = (n) => "$" + n.toFixed(2);
const r2 = (n) => Math.round(n * 100) / 100;
const abierta = (m) => estado.mesas.find((x) => x.mesa === m) || null;

function toast(msg, kind = "ok", emoji = "✓") {
  const t = document.createElement("div");
  t.className = "toast " + kind;
  t.innerHTML = `<span class="te">${emoji}</span><span>${msg}</span>`;
  $("toasts").appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

async function api(path, body) {
  const res = await fetch("/lab" + path, {
    method: body ? "POST" : "GET",
    headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const j = await res.json().catch(() => ({}));
  if (!res.ok || j.ok === false) throw new Error(j.error || res.statusText);
  return j;
}

/* Recalcular totales locales de una mesa (mismo modelo que el servidor). */
function recalc(m) {
  m.subtotal = r2(m.items.reduce((s, i) => s + i.precio * i.cantidad, 0));
  m.iva = r2(m.subtotal * 0.15);
  m.servicio = r2(m.subtotal * 0.10);
  m.total = r2(m.subtotal + m.iva + m.servicio);
}

/* Toda op es OPTIMISTA: muta el estado local YA, pinta YA, y sincroniza
   detrás. El sync va por una COLA secuencial — si dos taps salieran en
   paralelo, el /agregar podría correr antes de que el /precuenta committee
   (nos pasó: se perdían platos). La UI nunca espera; el servidor va en orden. */
let cola = Promise.resolve();
function optimista(mutar, sync) {
  mutar();
  pintar();
  inflight++;
  cola = cola
    .then(sync)
    .catch((e) => { toast(e.message, "bad", "✕"); })
    .finally(async () => {
      inflight--;
      if (inflight === 0) await refrescar(true);
    });
}

function pintar() {
  const a = sel ? abierta(sel) : null;
  const dirty = !!sel && dirtyMesas.has(sel);
  const saving = !!sel && savingMesa === sel;
  $("ctAbiertas").textContent = `${estado.mesas.length} abierta${estado.mesas.length === 1 ? "" : "s"}`;

  $("mesas").innerHTML = MESAS.map((m) => {
    const o = abierta(m);
    return `<button class="tcard ${o ? "abierta" : ""} ${sel === m ? "sel" : ""}" data-m="${m}">
      <span class="tn">${m}</span>
      <span class="ts">${o ? `${o.secuencia} · ${money(o.total)}` : "Libre"}</span>
    </button>`;
  }).join("");
  document.querySelectorAll(".tcard").forEach((b) =>
    b.addEventListener("click", () => { sel = b.dataset.m; pintar(); }));

  $("prodHint").style.display = a ? "none" : "block";
  $("prods").innerHTML = PRODUCTOS.map(([ic, n, p], i) =>
    `<button class="pcard" data-i="${i}" ${a ? "" : "disabled"}>
      <span class="pi">${ic}</span><span class="pn">${n}</span><span class="pp tnum">${money(p)}</span>
    </button>`).join("");
  document.querySelectorAll(".pcard").forEach((b) =>
    b.addEventListener("click", () => agregar(Number(b.dataset.i))));

  $("mesaSel").textContent = sel
    ? (a ? `${sel} · ${saving ? "guardando en MySQL…" : dirty ? "cambios sin guardar" : "guardado en MySQL"}` : `${sel} · sin pre-cuenta`)
    : "Ninguna mesa seleccionada";
  const secu = $("secuencia");
  secu.hidden = !a; if (a) secu.textContent = a.secuencia;
  $("btnPre").disabled = !sel || !!a || inflight > 0 || saving;
  $("btnSave").disabled = !a || !dirty || inflight > 0 || saving;
  $("btnSave").textContent = saving ? "Guardando…" : dirty ? "Guardar cambios" : "Guardado ✓";
  $("btnFac").disabled = !a || !a.items.length || inflight > 0 || saving;
  $("btnAnu").disabled = !a || inflight > 0 || saving;

  $("lineas").innerHTML = a && a.items.length
    ? a.items.map((i) => `<div class="li ${i.lineaId < 0 ? "pend" : ""}">
        <span class="lpi">${(PRODUCTOS.find((p) => p[1] === i.nombre) || ["🍽"])[0]}</span>
        <span class="lmain"><span class="lnm">${i.nombre}</span>
          <span class="qty"><span class="qv">${i.cantidad}</span><span class="qx">× ${money(i.precio)}</span></span></span>
        <span class="lright"><span class="lp tnum">${money(i.precio * i.cantidad)}</span>
          <button class="ldel" data-l="${i.lineaId}" title="Quitar">✕</button></span>
      </div>`).join("")
    : `<div class="bill-empty"><span class="be">🧾</span><span class="bh">${a ? "Sin platos todavía" : "Sin pre-cuenta"}</span>
       <span>${a ? "Toca un plato para agregarlo." : "Selecciona una mesa y abre la pre-cuenta."}</span></div>`;
  document.querySelectorAll(".ldel").forEach((b) =>
    b.addEventListener("click", () => quitar(Number(b.dataset.l))));

  $("tot").innerHTML = a ? `
    <div class="tr"><span>Subtotal</span><span class="tnum">${money(a.subtotal)}</span></div>
    <div class="tr"><span>IVA 15%</span><span class="tnum">${money(a.iva)}</span></div>
    <div class="tr"><span>Servicio 10%</span><span class="tnum">${money(a.servicio)}</span></div>
    <div class="tr grand"><span>Total</span><span class="tnum">${money(a.total)}</span></div>` : "";
}

async function refrescar(force = false) {
  if (inflight > 0 && !force) { pintar(); return; }  // no pisar la UI optimista
  try {
    const fresh = await api("/state");
    // Un poll puede llegar mientras el mesero arma un borrador. Preservamos
    // esas líneas locales hasta Guardar; el resto de mesas sí se refresca.
    const drafts = new Map(
      estado.mesas.filter((m) => dirtyMesas.has(m.mesa)).map((m) => [m.mesa, m]),
    );
    fresh.mesas = fresh.mesas.map((m) => drafts.get(m.mesa) || m);
    for (const [mesa, draft] of drafts) {
      if (!fresh.mesas.some((m) => m.mesa === mesa)) fresh.mesas.push(draft);
    }
    estado = fresh;
    $("conn").textContent = "MySQL pos_contifico · en línea";
    $("conn").style.color = "";
  } catch {
    $("conn").textContent = "Sin conexión al MySQL";
    $("conn").style.color = "var(--bad)";
  }
  pintar();
}

/* ── acciones (instantáneas) ── */
function agregar(i) {
  if (!sel) return;
  const [, nombre, precio] = PRODUCTOS[i];
  const mesa = sel;
  const m = abierta(mesa); if (!m) return;
  const linea = m.items.find((x) => x.nombre === nombre && x.precio === precio);
  if (linea) linea.cantidad += 1;
  else m.items.push({ lineaId: tmpId--, nombre, precio, cantidad: 1 });
  recalc(m);
  dirtyMesas.add(mesa);
  pintar();
}

function quitar(lineaId) {
  const mesa = sel;
  const m = abierta(mesa); if (!m) return;
  m.items = m.items.filter((x) => x.lineaId !== lineaId);
  recalc(m);
  dirtyMesas.add(mesa);
  pintar();
}

async function guardarMesa(mesa, { quiet = false } = {}) {
  const m = abierta(mesa);
  if (!m) throw new Error("No hay pre-cuenta abierta en esa mesa");
  const items = m.items.map(({ nombre, precio, cantidad }) => ({ nombre, precio, cantidad }));
  savingMesa = mesa;
  pintar();
  try {
    const r = await api("/guardar", { mesa, items });
    dirtyMesas.delete(mesa);
    await refrescar(true);
    if (!quiet) toast(`${mesa} guardada en MySQL · ${money(r.total)} · el Bridge ya puede leerla`, "mqr", "💾");
    return r;
  } finally {
    savingMesa = null;
    pintar();
  }
}

$("btnSave").addEventListener("click", async () => {
  if (!sel || !dirtyMesas.has(sel)) return;
  try { await guardarMesa(sel); }
  catch (e) { toast(e.message, "bad", "✕"); }
});

$("btnPre").addEventListener("click", () => {
  const mesa = sel;
  optimista(() => {
    estado.mesas.push({ mesa, secuencia: "PRE-…", total: 0, subtotal: 0, iva: 0, servicio: 0, items: [] });
  }, async () => {
    const r = await api("/precuenta", { mesa });
    toast(`Pre-cuenta ${r.secuencia} abierta — ya la ve el Bridge`, "mqr", "🧾");
  });
});

$("btnFac").addEventListener("click", () => {
  const mesa = sel;
  (async () => {
    try {
      if (dirtyMesas.has(mesa)) await guardarMesa(mesa, { quiet: true });
      const total = abierta(mesa)?.total ?? 0;
      savingMesa = mesa; pintar();
      const r = await api("/facturar", { mesa, formaPago: "TC" });
      dirtyMesas.delete(mesa);
      await refrescar(true);
      toast(`Facturado ${r.documento} · ${money(r.total ?? total)} — P→C, sale del Bridge`, "ok", "✓");
    } catch (e) {
      toast(e.message, "bad", "✕");
    } finally {
      savingMesa = null; pintar();
    }
  })();
});

$("btnAnu").addEventListener("click", () => {
  const mesa = sel;
  optimista(() => {
    dirtyMesas.delete(mesa);
    estado.mesas = estado.mesas.filter((m) => m.mesa !== mesa);
  }, async () => {
    await api("/anular", { mesa });
    toast("Pre-cuenta anulada (estado A)", "bad", "⊘");
  });
});

/* ── panel Verificar Bridge: todo lo necesario para conectar el puente ── */
$("btnBridge").addEventListener("click", async () => {
  const scrim = $("bridgeScrim");
  scrim.hidden = false;
  const box = (st, t, s) => `<div class="bcheck ${st}"><span class="bi">${st === "ok" ? "✓" : st === "bad" ? "✕" : "…"}</span><div><b>${t}</b><small>${s}</small></div></div>`;
  scrim.innerHTML = `<div class="bpanel"><h2>🔌 Conexión con el Bridge</h2>
    <div class="sub2">Verificando que el agente de Mesita pueda leer este POS…</div>
    ${box("", "Consultando", "Un momento…")}</div>`;
  scrim.onclick = (e) => { if (e.target === scrim) scrim.hidden = true; };
  try {
    const r = await api("/bridge-check");
    const c = r.checks;
    scrim.innerHTML = `<div class="bpanel">
      <h2>🔌 Conexión con el Bridge</h2>
      <div class="sub2">Esto es lo que Mesita Caja ve. Con la versión actual basta pulsar “Detectar POS automáticamente” en su asistente.</div>
      ${box(c.mysql ? "ok" : "bad", "MySQL del POS alcanzable", c.mysql ? `Conectado a ${r.conn.host}:${r.conn.port}` : "No responde — ¿está corriendo el MySQL en 3307?")}
      ${box(c.schema ? "ok" : "bad", "Esquema pos_contifico presente", c.schema ? "factura_cabecera, factura_detalle e inventario_producto existen." : "Faltan tablas — carga init/01-schema.sql")}
      ${box(c.readOnly ? "ok" : "bad", "Usuario mesita_ro SOLO lectura", c.readOnly ? "Un DELETE fue denegado — el Bridge no puede escribir jamás." : "¡El usuario puede escribir! Revisa los GRANT.")}
      ${box(c.query ? "ok" : "bad", "Query del agente funciona", c.query ? `${r.precuentas.length} pre-cuenta(s) visibles ahora: ${r.precuentas.map((p) => `${p.mesa} (${money(Number(p.totalCents ?? p.total))})`).join(", ") || "ninguna abierta"}` : "La query exacta del agente falló.")}
      <div class="bconn">
        <b style="font-size:.8rem">Todos los datos del asistente de Mesita Caja</b>
        <div class="row2"><span>Launcher.exe.config</span><code>${r.launcher.configPath || "Disponible para descargar"}</code></div>
        <div class="row2"><span>Host</span><code>${r.setup.mysql.host}</code></div>
        <div class="row2"><span>Puerto</span><code>${r.setup.mysql.port}</code></div>
        <div class="row2"><span>Base de datos</span><code>${r.setup.mysql.database}</code></div>
        <div class="row2"><span>Usuario solo lectura</span><code>${r.setup.mysql.user}</code></div>
        <div class="row2"><span>Clave solo lectura</span><code>${r.setup.mysql.password}</code></div>
        <div class="row2"><span>Clave administrador</span><code>No se necesita — candado ya creado</code></div>
        <div class="row2"><span>Token Bridge</span><code>Se genera una vez en el portal Mesita</code></div>
        <a class="btn btn-outline btn-sm bdownload" href="${r.launcher.downloadUrl}" download="Launcher.exe.config">⬇ Descargar Launcher.exe.config simulado</a>
      </div>
    </div>`;
  } catch (e) {
    scrim.innerHTML = `<div class="bpanel"><h2>🔌 Conexión con el Bridge</h2>
      ${box("bad", "No se pudo verificar", e.message)}</div>`;
  }
});

refrescar();
setInterval(() => refrescar(), 2500);
</script>
</body>
</html>
